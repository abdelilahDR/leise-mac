<!DOCTYPE html>
<html>
<head>
  <title>Voice Recorder</title>
</head>
<body>
  <script>
    // ============================================
    // State Variables
    // ============================================
    let apiKey = '';
    let groqApiKey = '';
    let transcriptionProvider = 'openai';
    let recordingSessionId = 0;
    let currentAbortController = null;

    // User-selected input device (null = follow system default)
    let preferredInputDeviceId = null;

    // Shared AudioContext (reused to prevent accumulation)
    let sharedAudioContext = null;

    // Current recording state (isolated per session)
    let currentRecording = null;

    // Peak normalized level (0-1) below which we treat the recording as
    // "microphone is silent". Tuned so ordinary room noise still passes.
    const SILENCE_THRESHOLD = 0.02;

    function buildSilenceMessage(deviceLabel) {
      const label = deviceLabel || 'unknown device';
      return `Microphone is silent — using "${label}". Check System Settings → Sound → Input.`;
    }

    // Decode the finished recording and return the peak absolute sample in
    // [0, 1]. This is our authoritative silence signal because it reads the
    // same bytes Whisper would receive, bypassing the live analyser graph
    // (which can read flat zeros after macOS output-device swaps even while
    // the underlying MediaStreamTrack is capturing real audio).
    // Returns null on decode error — fail-open so we'd rather pay for a
    // stray Whisper call than falsely accuse the mic.
    async function measureBlobPeak(blob) {
      try {
        const arrayBuffer = await blob.arrayBuffer();
        // Throwaway offline context just for decoding; its sample rate
        // doesn't affect peak amplitude.
        const ctx = new OfflineAudioContext(1, 1, 16000);
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        const ch = audioBuffer.getChannelData(0);
        let peak = 0;
        for (let i = 0; i < ch.length; i++) {
          const v = Math.abs(ch[i]);
          if (v > peak) peak = v;
        }
        return peak;
      } catch (e) {
        console.warn('measureBlobPeak decode failed, assuming non-silent:', e);
        return null;
      }
    }

    // ============================================
    // AudioContext Management
    // ============================================
    function getAudioContext() {
      if (!sharedAudioContext || sharedAudioContext.state === 'closed') {
        sharedAudioContext = new AudioContext();
      }
      // CRITICAL: Resume if suspended (browsers suspend inactive contexts)
      if (sharedAudioContext.state === 'suspended') {
        sharedAudioContext.resume();
      }
      return sharedAudioContext;
    }

    function closeAudioContext() {
      if (sharedAudioContext && sharedAudioContext.state !== 'closed') {
        sharedAudioContext.close().catch(() => {});
      }
      sharedAudioContext = null;
    }

    // Rebuild the audio context whenever the system's audio devices change
    // (e.g. plugging/unplugging a monitor, switching Bluetooth headset).
    // Without this, Chromium can keep routing audio from a stale default device.
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', async () => {
        console.log('Audio devices changed — resetting audio context');
        closeAudioContext();

        // If the user's explicitly chosen input just disappeared, drop it
        // so the next recording gracefully falls back to the system default
        // instead of erroring out.
        if (preferredInputDeviceId) {
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const stillPresent = devices.some(
              (d) => d.kind === 'audioinput' && d.deviceId === preferredInputDeviceId
            );
            if (!stillPresent) {
              console.log('Preferred input device disappeared, clearing in-memory preference');
              preferredInputDeviceId = null;
            }
          } catch (e) {
            console.warn('devicechange enumerate failed:', e);
          }
        }
      });
    }

    // ============================================
    // Device Selection
    // ============================================
    async function resolveDefaultAudioInputId() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter((d) => d.kind === 'audioinput');
        console.log(
          'Available audio inputs:',
          inputs.map((d) => `${d.label || '(no label)'} [${d.deviceId}]`)
        );
        // If the user has explicitly picked an input in Settings and it is
        // still present, honor that choice over whatever macOS considers
        // the current default.
        if (preferredInputDeviceId) {
          const match = inputs.find((d) => d.deviceId === preferredInputDeviceId);
          if (match) {
            console.log('Using preferred input device:', match.label || preferredInputDeviceId);
            return preferredInputDeviceId;
          }
          console.warn('Preferred input device not available, falling back to system default');
        }
        // Prefer the magic 'default' pseudo-device — Chromium resolves this
        // to the CURRENT system default on every getUserMedia call, which is
        // exactly what we want after the user swaps monitors/headsets.
        const def = inputs.find((d) => d.deviceId === 'default');
        if (def) return 'default';
        if (inputs.length > 0) return inputs[0].deviceId;
      } catch (e) {
        console.warn('enumerateDevices failed:', e);
      }
      return null;
    }

    // ============================================
    // Recording Cleanup
    // ============================================
    function cleanupCurrentRecording() {
      if (!currentRecording) return;

      // Stop level monitoring
      if (currentRecording.levelInterval) {
        clearInterval(currentRecording.levelInterval);
      }

      // Disconnect audio graph nodes (prevents accumulation)
      if (currentRecording.source) {
        try {
          currentRecording.source.disconnect();
        } catch (e) {
          // Already disconnected, ignore
        }
      }

      // Stop MediaRecorder if still active
      if (currentRecording.mediaRecorder && currentRecording.mediaRecorder.state !== 'inactive') {
        try {
          currentRecording.mediaRecorder.stop();
        } catch (e) {
          // Already stopped, ignore
        }
      }

      // Stop stream tracks
      if (currentRecording.stream) {
        currentRecording.stream.getTracks().forEach(track => {
          try {
            track.stop();
          } catch (e) {
            // Already stopped, ignore
          }
        });
      }

      currentRecording = null;
    }

    // ============================================
    // IPC Handlers
    // ============================================
    window.electronAPI.onSetApiKey((key) => {
      apiKey = key;
    });

    window.electronAPI.onSetGroqApiKey((key) => {
      groqApiKey = key;
    });

    window.electronAPI.onSetTranscriptionProvider((provider) => {
      transcriptionProvider = provider || 'openai';
    });

    window.electronAPI.onSetPreferredInputDevice((id) => {
      preferredInputDeviceId = id || null;
      console.log('Preferred input device set to:', preferredInputDeviceId || '(system default)');
    });

    // ============================================
    // Recording Functions
    // ============================================
    async function startRecording() {
      // Increment session ID FIRST
      const mySessionId = ++recordingSessionId;

      // Abort any pending transcription from previous session
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }

      // Clean up any previous recording BEFORE starting new one
      cleanupCurrentRecording();

      try {
        // Resolve the CURRENT system default input every time we record so
        // that monitor/headset swaps take effect immediately.
        const deviceId = await resolveDefaultAudioInputId();
        const audioConstraints = {
          channelCount: 1,
          sampleRate: 16000,
        };
        if (deviceId) {
          audioConstraints.deviceId = { exact: deviceId };
        }

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        } catch (primaryErr) {
          // If the exact device vanished between enumeration and capture,
          // fall back to whatever the browser considers the default.
          console.warn('getUserMedia with resolved device failed, falling back:', primaryErr);
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, sampleRate: 16000 }
          });
        }

        let deviceLabel = 'unknown device';
        const [audioTrack] = stream.getAudioTracks();
        if (audioTrack) {
          const settings = audioTrack.getSettings ? audioTrack.getSettings() : {};
          deviceLabel = audioTrack.label || 'unknown device';
          console.log('Recording from device:', deviceLabel, settings);
        }

        // Check if we were superseded while waiting for mic
        if (mySessionId !== recordingSessionId) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        // Get/resume AudioContext
        const audioContext = getAudioContext();

        // Set up audio analysis
        const analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.5;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // Create MediaRecorder
        const mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        // This session's audio chunks (isolated from other sessions)
        const audioChunks = [];

        // Store current recording state
        currentRecording = {
          sessionId: mySessionId,
          stream: stream,
          mediaRecorder: mediaRecorder,
          source: source,
          analyser: analyser,
          audioChunks: audioChunks,
          levelInterval: null,
          cancelled: false,
          deviceLabel: deviceLabel,
          peakLevel: 0,
        };

        // Level monitoring (send to main for waveform)
        currentRecording.levelInterval = setInterval(() => {
          // Check if this recording is still current
          if (!currentRecording || currentRecording.sessionId !== mySessionId) {
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          const bandSize = Math.floor(bufferLength / 5);
          const levels = [];
          for (let i = 0; i < 5; i++) {
            const start = i * bandSize;
            const end = start + bandSize;
            let sum = 0;
            for (let j = start; j < end; j++) {
              sum += dataArray[j];
            }
            levels.push(sum / (bandSize * 255));
          }

          // Track the loudest band we've ever seen during this recording so
          // we can detect "mic is silent" at stop time.
          currentRecording.peakLevel = Math.max(currentRecording.peakLevel, ...levels);

          window.electronAPI.sendAudioLevels(levels);
        }, 50);

        // Collect audio data
        mediaRecorder.ondataavailable = (event) => {
          // Only add chunks if this is still the current session
          if (currentRecording && currentRecording.sessionId === mySessionId && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        // Handle recording stop
        mediaRecorder.onstop = async () => {
          // CRITICAL: Check if this onstop belongs to current session
          if (!currentRecording || currentRecording.sessionId !== mySessionId) {
            console.log('Ignoring onstop from stale session', mySessionId);
            return;
          }

          // Check if cancelled
          if (currentRecording.cancelled) {
            console.log('Recording was cancelled, not transcribing');
            return;
          }

          // Capture chunks immediately (before any async work)
          const chunksToProcess = [...audioChunks];
          const capturedPeak = currentRecording.peakLevel;
          const capturedLabel = currentRecording.deviceLabel;

          // Stop stream tracks (this recording's stream only)
          stream.getTracks().forEach(track => track.stop());

          // Create blob from this session's chunks only
          const audioBlob = new Blob(chunksToProcess, { type: 'audio/webm' });

          // A tiny blob is unambiguously broken — don't bother decoding.
          if (audioBlob.size < 1000) {
            console.warn(
              'Silence detected — blob too small, size:', audioBlob.size,
              'device:', capturedLabel
            );
            if (mySessionId === recordingSessionId) {
              window.electronAPI.sendTranscriptionError(buildSilenceMessage(capturedLabel));
            }
            return;
          }

          // Decode the actual recorded bytes to get an authoritative peak.
          // The live analyser (capturedPeak) can read flat zeros after a
          // macOS output-device swap even while the MediaRecorder was
          // capturing real audio — so we can't trust it to gate Whisper.
          const measuredPeak = await measureBlobPeak(audioBlob);
          console.log(
            'Created audio blob, size:', audioBlob.size,
            'chunks:', chunksToProcess.length,
            'session:', mySessionId,
            'livePeak:', capturedPeak.toFixed(4),
            'measuredPeak:', measuredPeak === null ? 'null' : measuredPeak.toFixed(4),
            'device:', capturedLabel
          );

          // Silence detection: use the decoded peak as the source of truth.
          // If decode failed (null), fail open and let Whisper try.
          if (measuredPeak !== null && measuredPeak < SILENCE_THRESHOLD) {
            console.warn(
              'Silence detected — measuredPeak:', measuredPeak.toFixed(4),
              'livePeak:', capturedPeak.toFixed(4),
              'blob size:', audioBlob.size,
              'device:', capturedLabel
            );
            if (mySessionId === recordingSessionId) {
              window.electronAPI.sendTranscriptionError(buildSilenceMessage(capturedLabel));
            }
            return;
          }

          // Transcribe
          await transcribeAudio(audioBlob, mySessionId);
        };

        // Start recording with 100ms timeslice
        mediaRecorder.start(100);
        console.log('MediaRecorder started, session:', mySessionId);
        window.electronAPI.sendRecordingStatus('started');

      } catch (error) {
        console.error('Failed to start recording:', error);
        if (mySessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(`Microphone access denied: ${error.message}`);
        }
      }
    }

    function stopRecording() {
      if (!currentRecording) return;

      // Stop level monitoring
      if (currentRecording.levelInterval) {
        clearInterval(currentRecording.levelInterval);
        currentRecording.levelInterval = null;
      }

      // Disconnect audio source (prevents accumulation)
      if (currentRecording.source) {
        try {
          currentRecording.source.disconnect();
        } catch (e) {}
        currentRecording.source = null;
      }

      // Stop MediaRecorder (triggers onstop which handles transcription)
      if (currentRecording.mediaRecorder && currentRecording.mediaRecorder.state !== 'inactive') {
        currentRecording.mediaRecorder.stop();
        window.electronAPI.sendRecordingStatus('stopped');
      }
    }

    function cancelRecording() {
      if (!currentRecording) return;

      // Mark as cancelled so onstop knows not to transcribe
      currentRecording.cancelled = true;

      // Clean up everything
      cleanupCurrentRecording();

      window.electronAPI.sendRecordingStatus('cancelled');
    }

    // ============================================
    // Transcription
    // ============================================
    async function transcribeAudio(audioBlob, sessionId) {
      console.log('Starting transcription, blob size:', audioBlob.size, 'session:', sessionId);
      console.log('Provider:', transcriptionProvider);

      const useGroq = transcriptionProvider === 'groq';
      const primaryKey = useGroq ? groqApiKey : apiKey;
      const fallbackKey = useGroq ? apiKey : groqApiKey;
      const hasFallback = !!fallbackKey;

      console.log('API key available:', primaryKey ? 'YES' : 'NO');
      console.log('Fallback available:', hasFallback ? 'YES' : 'NO');

      // Validate API key
      if (!primaryKey) {
        console.error('No API key!');
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(`${useGroq ? 'Groq' : 'OpenAI'} API key not configured`);
        }
        return;
      }

      // Note: silence / too-small-blob is detected in mediaRecorder.onstop
      // and surfaced as a descriptive transcription error before we ever
      // get here, so we unconditionally hit the API below.

      // Create abort controller for this transcription
      currentAbortController = new AbortController();
      const abortController = currentAbortController;

      // Helper to call API
      async function callTranscriptionAPI(provider, key) {
        const isGroq = provider === 'groq';
        const formData = new FormData();
        const audioFile = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
        formData.append('file', audioFile);
        formData.append('model', isGroq ? 'whisper-large-v3' : 'whisper-1');
        formData.append('response_format', 'text');

        const endpoint = isGroq
          ? 'https://api.groq.com/openai/v1/audio/transcriptions'
          : 'https://api.openai.com/v1/audio/transcriptions';

        console.log(`Sending to ${isGroq ? 'Groq' : 'OpenAI'} API, file size:`, audioBlob.size);

        const timeoutId = setTimeout(() => abortController.abort(), 60000);

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${key}` },
          body: formData,
          signal: abortController.signal
        });

        clearTimeout(timeoutId);
        console.log('API response status:', response.status);

        return { response, provider: isGroq ? 'Groq' : 'OpenAI' };
      }

      try {
        // Try primary provider
        const primaryProvider = useGroq ? 'groq' : 'openai';
        let { response, provider } = await callTranscriptionAPI(primaryProvider, primaryKey);

        // Fallback on rate limit or server error
        if (!response.ok && hasFallback && (response.status === 429 || response.status >= 500)) {
          console.log(`${provider} failed with ${response.status}, falling back...`);
          const fallbackProvider = useGroq ? 'openai' : 'groq';
          const fallbackResult = await callTranscriptionAPI(fallbackProvider, fallbackKey);
          response = fallbackResult.response;
          provider = fallbackResult.provider;
        }

        if (!response.ok) {
          const errorText = await response.text();
          let errorMessage = `API error: ${response.status}`;

          try {
            const errorJson = JSON.parse(errorText);
            if (errorJson.error?.message) {
              errorMessage = errorJson.error.message;
            }
          } catch (e) {
            errorMessage = errorText || errorMessage;
          }

          throw new Error(errorMessage);
        }

        const text = await response.text();
        console.log(`Transcription result (via ${provider}):`, text.trim());

        // Only send if still current session
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionResult(text.trim());
        } else {
          console.log('Ignoring stale result from session', sessionId);
        }

      } catch (error) {
        // Ignore aborted requests from old sessions
        if (error.name === 'AbortError' && sessionId !== recordingSessionId) {
          console.log('Ignoring aborted request from old session', sessionId);
          return;
        }

        console.error('Transcription failed:', error);

        let message = error.message;
        if (error.name === 'AbortError') {
          message = 'Request timed out. Please try again.';
        }

        // Only send error if still current session
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(message);
        } else {
          console.log('Ignoring stale error from session', sessionId);
        }
      }
    }

    // ============================================
    // IPC Message Listeners
    // ============================================
    window.electronAPI.onStartRecording(() => {
      startRecording();
    });

    window.electronAPI.onStopRecording(() => {
      stopRecording();
    });

    window.electronAPI.onCancelRecording(() => {
      cancelRecording();
    });
  </script>
</body>
</html>
