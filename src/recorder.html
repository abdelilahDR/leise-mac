<!DOCTYPE html>
<html>
<head>
  <title>Voice Recorder</title>
</head>
<body>
  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;
    let apiKey = '';
    let groqApiKey = '';
    let transcriptionProvider = 'openai'; // 'openai' or 'groq'
    let cancelled = false;
    let audioContext = null;
    let analyser = null;
    let levelInterval = null;

    // Receive API key from main process
    window.electronAPI.onSetApiKey((event, key) => {
      apiKey = key;
    });

    // Receive Groq API key
    window.electronAPI.onSetGroqApiKey((event, key) => {
      groqApiKey = key;
    });

    // Receive transcription provider setting
    window.electronAPI.onSetTranscriptionProvider((event, provider) => {
      transcriptionProvider = provider || 'openai';
    });

    async function startRecording() {
      cancelled = false;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
          }
        });

        currentStream = stream;

        // Set up Web Audio API for audio level visualization
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.5;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // Send audio levels to main process for waveform visualization
        levelInterval = setInterval(() => {
          analyser.getByteFrequencyData(dataArray);

          // Get 5 frequency bands for the bars
          const bandSize = Math.floor(bufferLength / 5);
          const levels = [];
          for (let i = 0; i < 5; i++) {
            const start = i * bandSize;
            const end = start + bandSize;
            let sum = 0;
            for (let j = start; j < end; j++) {
              sum += dataArray[j];
            }
            // Normalize to 0-1 range
            levels.push(sum / (bandSize * 255));
          }

          window.electronAPI.sendAudioLevels(levels);
        }, 50); // ~20fps for smooth animation

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          console.log('MediaRecorder stopped, chunks:', audioChunks.length);
          // Stop all tracks
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
          }

          // Don't transcribe if cancelled
          if (cancelled) {
            console.log('Recording was cancelled, not transcribing');
            return;
          }

          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          console.log('Created audio blob, size:', audioBlob.size);
          await transcribeAudio(audioBlob);
        };

        mediaRecorder.start(100); // Collect data every 100ms
        console.log('MediaRecorder started');
        window.electronAPI.sendRecordingStatus('started');

      } catch (error) {
        console.error('Failed to start recording:', error);
        window.electronAPI.sendTranscriptionError(`Microphone access denied: ${error.message}`);
      }
    }

    function stopRecording() {
      // Stop audio level monitoring
      if (levelInterval) {
        clearInterval(levelInterval);
        levelInterval = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        window.electronAPI.sendRecordingStatus('stopped');
      }
    }

    // Convert audio blob to WAV format for better API compatibility
    async function convertToWav(audioBlob) {
      const arrayBuffer = await audioBlob.arrayBuffer();
      const audioCtx = new AudioContext();

      try {
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        // Get audio data
        const numberOfChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const length = audioBuffer.length;

        // Create WAV file
        const wavBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
        const view = new DataView(wavBuffer);

        // WAV header
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + length * numberOfChannels * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true); // PCM format chunk size
        view.setUint16(20, 1, true); // Audio format (PCM)
        view.setUint16(22, numberOfChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numberOfChannels * 2, true); // Byte rate
        view.setUint16(32, numberOfChannels * 2, true); // Block align
        view.setUint16(34, 16, true); // Bits per sample
        writeString(36, 'data');
        view.setUint32(40, length * numberOfChannels * 2, true);

        // Write audio data
        const offset = 44;
        for (let i = 0; i < length; i++) {
          for (let channel = 0; channel < numberOfChannels; channel++) {
            const sample = audioBuffer.getChannelData(channel)[i];
            // Convert float [-1, 1] to 16-bit PCM
            const intSample = Math.max(-1, Math.min(1, sample)) * 0x7FFF;
            view.setInt16(offset + (i * numberOfChannels + channel) * 2, intSample, true);
          }
        }

        audioCtx.close();
        return new Blob([wavBuffer], { type: 'audio/wav' });
      } catch (error) {
        console.error('WAV conversion failed:', error);
        audioCtx.close();
        throw error;
      }
    }

    function cancelRecording() {
      cancelled = true;

      // Stop audio level monitoring
      if (levelInterval) {
        clearInterval(levelInterval);
        levelInterval = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      audioChunks = [];
      window.electronAPI.sendRecordingStatus('cancelled');
    }

    async function transcribeAudio(audioBlob) {
      console.log('Starting transcription, blob size:', audioBlob.size);
      console.log('Provider:', transcriptionProvider);

      const useGroq = transcriptionProvider === 'groq';
      const primaryKey = useGroq ? groqApiKey : apiKey;
      const fallbackKey = useGroq ? apiKey : groqApiKey;
      const hasFallback = !!fallbackKey;

      console.log('API key available:', primaryKey ? 'YES' : 'NO');
      console.log('Fallback available:', hasFallback ? 'YES' : 'NO');

      if (!primaryKey) {
        console.error('No API key!');
        window.electronAPI.sendTranscriptionError(`${useGroq ? 'Groq' : 'OpenAI'} API key not configured`);
        return;
      }

      // Check if there's actually audio data
      if (audioBlob.size < 1000) {
        console.log('Audio blob too small, skipping');
        window.electronAPI.sendTranscriptionResult('');
        return;
      }

      // Helper function to call transcription API
      async function callTranscriptionAPI(provider, key) {
        const isGroq = provider === 'groq';
        const formData = new FormData();
        const audioFile = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
        formData.append('file', audioFile);
        formData.append('model', isGroq ? 'whisper-large-v3' : 'whisper-1');
        formData.append('response_format', 'text');

        const endpoint = isGroq
          ? 'https://api.groq.com/openai/v1/audio/transcriptions'
          : 'https://api.openai.com/v1/audio/transcriptions';

        console.log(`Sending to ${isGroq ? 'Groq' : 'OpenAI'} API, file size:`, audioBlob.size);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${key}` },
          body: formData,
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        console.log('API response status:', response.status);

        return { response, provider: isGroq ? 'Groq' : 'OpenAI' };
      }

      try {
        // Try primary provider
        const primaryProvider = useGroq ? 'groq' : 'openai';
        let { response, provider } = await callTranscriptionAPI(primaryProvider, primaryKey);

        // Check if we should fallback (429 rate limit or 5xx server error)
        if (!response.ok && hasFallback && (response.status === 429 || response.status >= 500)) {
          console.log(`${provider} failed with ${response.status}, falling back to ${useGroq ? 'OpenAI' : 'Groq'}...`);
          const fallbackProvider = useGroq ? 'openai' : 'groq';
          const fallbackResult = await callTranscriptionAPI(fallbackProvider, fallbackKey);
          response = fallbackResult.response;
          provider = fallbackResult.provider;
        }

        if (!response.ok) {
          const errorText = await response.text();
          let errorMessage = `API error: ${response.status}`;

          try {
            const errorJson = JSON.parse(errorText);
            if (errorJson.error?.message) {
              errorMessage = errorJson.error.message;
            }
          } catch (e) {
            errorMessage = errorText || errorMessage;
          }

          throw new Error(errorMessage);
        }

        const text = await response.text();
        console.log(`Transcription result (via ${provider}):`, text.trim());
        window.electronAPI.sendTranscriptionResult(text.trim());

      } catch (error) {
        console.error('Transcription failed:', error);

        let message = error.message;
        if (error.name === 'AbortError') {
          message = 'Request timed out. Please try again.';
        }

        window.electronAPI.sendTranscriptionError(message);
      }
    }

    // Listen for IPC messages
    window.electronAPI.onStartRecording(() => {
      startRecording();
    });

    window.electronAPI.onStopRecording(() => {
      stopRecording();
    });

    window.electronAPI.onCancelRecording(() => {
      cancelRecording();
    });
  </script>
</body>
</html>
