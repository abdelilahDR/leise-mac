<!DOCTYPE html>
<html>
<head>
  <title>Voice Recorder</title>
</head>
<body>
  <script>
    const { ipcRenderer } = require('electron');
    const FormData = require('form-data');
    const fetch = require('node-fetch');
    const fs = require('fs');
    const path = require('path');
    const os = require('os');

    let mediaRecorder = null;
    let audioChunks = [];

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            channelCount: 1,
            sampleRate: 16000,
          } 
        });
        
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });
        
        audioChunks = [];
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };
        
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await transcribeAudio(audioBlob);
          
          // Stop all tracks
          stream.getTracks().forEach(track => track.stop());
        };
        
        mediaRecorder.start(100); // Collect data every 100ms
        ipcRenderer.send('recording-status', 'started');
        
      } catch (error) {
        console.error('Failed to start recording:', error);
        ipcRenderer.send('transcription-error', `Microphone access denied: ${error.message}`);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        ipcRenderer.send('recording-status', 'stopped');
      }
    }

    async function transcribeAudio(audioBlob) {
      const apiKey = process.env.OPENAI_API_KEY;
      
      if (!apiKey) {
        ipcRenderer.send('transcription-error', 'OPENAI_API_KEY not set');
        return;
      }

      try {
        // Convert blob to buffer
        const arrayBuffer = await audioBlob.arrayBuffer();
        const buffer = Buffer.from(arrayBuffer);
        
        // Save to temp file (Whisper API requires a file)
        const tempPath = path.join(os.tmpdir(), `voice-dictation-${Date.now()}.webm`);
        fs.writeFileSync(tempPath, buffer);
        
        // Create form data
        const form = new FormData();
        form.append('file', fs.createReadStream(tempPath), {
          filename: 'audio.webm',
          contentType: 'audio/webm',
        });
        form.append('model', 'whisper-1');
        form.append('response_format', 'text');
        
        // Send to Whisper API
        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            ...form.getHeaders(),
          },
          body: form,
        });
        
        // Clean up temp file
        fs.unlinkSync(tempPath);
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`API error: ${response.status} - ${errorText}`);
        }
        
        const text = await response.text();
        ipcRenderer.send('transcription-result', text.trim());
        
      } catch (error) {
        console.error('Transcription failed:', error);
        ipcRenderer.send('transcription-error', error.message);
      }
    }

    // Listen for IPC messages
    ipcRenderer.on('start-recording', () => {
      startRecording();
    });

    ipcRenderer.on('stop-recording', () => {
      stopRecording();
    });

    console.log('Recorder ready');
  </script>
</body>
</html>
