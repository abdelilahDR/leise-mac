<!DOCTYPE html>
<html>
<head>
  <title>Voice Recorder</title>
</head>
<body>
  <script>
    console.log('recorder.html script loaded at', new Date().toISOString());

    // Surface any silent renderer crashes / promise rejections.
    window.addEventListener('error', (e) => {
      console.error('window.error:', e.message, '@', e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('unhandledrejection:', (e.reason && e.reason.message) || String(e.reason));
    });

    // ============================================
    // State Variables
    // ============================================
    let apiKey = '';
    let groqApiKey = '';
    let transcriptionProvider = 'openai';
    let customVocabulary = '';
    let recordingSessionId = 0;
    let currentAbortController = null;

    // Current recording state (isolated per session). AudioContext is now
    // created fresh per recording and closed in cleanup, instead of shared
    // across sessions — sharing accumulated bad state after long uptime
    // and was the suspected cause of "stuck on Transcribing…" hangs.
    let currentRecording = null;

    // ============================================
    // Recording Cleanup
    // ============================================
    function cleanupCurrentRecording() {
      if (!currentRecording) return;

      // Stop level monitoring
      if (currentRecording.levelInterval) {
        clearInterval(currentRecording.levelInterval);
      }

      // Disconnect audio graph nodes (prevents accumulation)
      if (currentRecording.source) {
        try {
          currentRecording.source.disconnect();
        } catch (e) {
          // Already disconnected, ignore
        }
      }

      // Stop MediaRecorder if still active
      if (currentRecording.mediaRecorder && currentRecording.mediaRecorder.state !== 'inactive') {
        try {
          currentRecording.mediaRecorder.stop();
        } catch (e) {
          // Already stopped, ignore
        }
      }

      // Stop stream tracks
      if (currentRecording.stream) {
        currentRecording.stream.getTracks().forEach(track => {
          try {
            track.stop();
          } catch (e) {
            // Already stopped, ignore
          }
        });
      }

      // Close the per-recording AudioContext so it doesn't leak.
      if (currentRecording.audioContext && currentRecording.audioContext.state !== 'closed') {
        currentRecording.audioContext.close().catch(() => {});
      }

      currentRecording = null;
    }

    // ============================================
    // IPC Handlers
    // ============================================
    window.electronAPI.onSetApiKey((key) => {
      apiKey = key;
    });

    window.electronAPI.onSetGroqApiKey((key) => {
      groqApiKey = key;
    });

    window.electronAPI.onSetTranscriptionProvider((provider) => {
      transcriptionProvider = provider || 'openai';
    });

    // ============================================
    // Recording Functions
    // ============================================
    async function startRecording() {
      // Increment session ID FIRST
      const mySessionId = ++recordingSessionId;

      // Abort any pending transcription from previous session
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }

      // Clean up any previous recording BEFORE starting new one
      cleanupCurrentRecording();

      try {
        const audioConstraints = { channelCount: 1, sampleRate: 16000 };
        try {
          const cfg = await window.electronAPI.getConfig();
          if (cfg && cfg.preferredInputDeviceId) {
            audioConstraints.deviceId = { exact: cfg.preferredInputDeviceId };
          }
          customVocabulary = ((cfg && cfg.customVocabulary) || '').trim();
        } catch (e) { /* fall through to default device */ }

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        } catch (err) {
          // Preferred mic unplugged or gone — retry on the default device
          // rather than failing the recording.
          if (audioConstraints.deviceId) {
            delete audioConstraints.deviceId;
            stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
          } else {
            throw err;
          }
        }

        // Check if we were superseded while waiting for mic
        if (mySessionId !== recordingSessionId) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        // Fresh AudioContext per recording — see comment near currentRecording.
        const audioContext = new AudioContext();

        // Set up audio analysis
        const analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.5;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // Create MediaRecorder
        const mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        // This session's audio chunks (isolated from other sessions)
        const audioChunks = [];

        // Store current recording state
        currentRecording = {
          sessionId: mySessionId,
          stream: stream,
          mediaRecorder: mediaRecorder,
          source: source,
          analyser: analyser,
          audioContext: audioContext,
          audioChunks: audioChunks,
          levelInterval: null,
          cancelled: false
        };

        // Level monitoring (send to main for waveform)
        currentRecording.levelInterval = setInterval(() => {
          // Check if this recording is still current
          if (!currentRecording || currentRecording.sessionId !== mySessionId) {
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          // 17 log-spaced bands, 80Hz to 5kHz. Linear splits put nearly all
          // speech energy in the first band (one tall bar, a row of dead dots);
          // log spacing spreads voice across every bar. The AudioContext runs
          // at the device rate (usually 48k), so band edges are computed from
          // the real bin width, never assumed.
          const BAND_COUNT = 17;
          const binHz = (audioContext.sampleRate / 2) / bufferLength;
          const FMIN = 80, FMAX = 5000;
          const levels = [];
          for (let i = 0; i < BAND_COUNT; i++) {
            const loHz = FMIN * Math.pow(FMAX / FMIN, i / BAND_COUNT);
            const hiHz = FMIN * Math.pow(FMAX / FMIN, (i + 1) / BAND_COUNT);
            const start = Math.min(bufferLength - 1, Math.round(loHz / binHz));
            const end = Math.min(bufferLength, Math.max(start + 1, Math.round(hiHz / binHz)));
            let sum = 0;
            for (let j = start; j < end; j++) {
              sum += dataArray[j];
            }
            levels.push(sum / ((end - start) * 255));
          }

          window.electronAPI.sendAudioLevels(levels);
        }, 50);

        // Collect audio data
        mediaRecorder.ondataavailable = (event) => {
          // Only add chunks if this is still the current session
          if (currentRecording && currentRecording.sessionId === mySessionId && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        // Handle recording stop
        mediaRecorder.onstop = async () => {
          // CRITICAL: Check if this onstop belongs to current session
          if (!currentRecording || currentRecording.sessionId !== mySessionId) {
            console.log('Ignoring onstop from stale session', mySessionId);
            return;
          }

          // Check if cancelled
          if (currentRecording.cancelled) {
            console.log('Recording was cancelled, not transcribing');
            return;
          }

          // Capture chunks immediately (before any async work)
          const chunksToProcess = [...audioChunks];

          // Stop stream tracks (this recording's stream only)
          stream.getTracks().forEach(track => track.stop());

          // Create blob from this session's chunks only
          const audioBlob = new Blob(chunksToProcess, { type: 'audio/webm' });
          console.log('Created audio blob, size:', audioBlob.size, 'chunks:', chunksToProcess.length, 'session:', mySessionId);

          // Transcribe
          await transcribeAudio(audioBlob, mySessionId);
        };

        // Start recording with 100ms timeslice
        mediaRecorder.start(100);
        console.log('MediaRecorder started, session:', mySessionId);
        window.electronAPI.sendRecordingStatus('started');

      } catch (error) {
        console.error('Failed to start recording:', error);
        if (mySessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(`Microphone access denied: ${error.message}`);
        }
      }
    }

    function stopRecording() {
      if (!currentRecording) return;

      // Stop level monitoring
      if (currentRecording.levelInterval) {
        clearInterval(currentRecording.levelInterval);
        currentRecording.levelInterval = null;
      }

      // Disconnect audio source (prevents accumulation)
      if (currentRecording.source) {
        try {
          currentRecording.source.disconnect();
        } catch (e) {}
        currentRecording.source = null;
      }

      // Stop MediaRecorder (triggers onstop which handles transcription)
      if (currentRecording.mediaRecorder && currentRecording.mediaRecorder.state !== 'inactive') {
        currentRecording.mediaRecorder.stop();
        window.electronAPI.sendRecordingStatus('stopped');
      }
    }

    function cancelRecording() {
      if (!currentRecording) return;

      // Mark as cancelled so onstop knows not to transcribe
      currentRecording.cancelled = true;

      // Clean up everything
      cleanupCurrentRecording();

      window.electronAPI.sendRecordingStatus('cancelled');
    }

    // ============================================
    // Whisper hallucination cleanup
    // ============================================
    // Whisper was trained on YouTube content and tends to confabulate
    // outro phrases ("Thank you for watching", "Subscribe", etc.) when
    // fed silence or near-silence at the end of a clip. Strip those from
    // the tail. Body-length guard preserves a legitimate single-utterance
    // "Thank you" that the user actually spoke alone.
    const HALLUCINATION_TAIL_PATTERNS = [
      /\s*thank you for watching[\s.!]*$/i,
      /\s*thanks for watching[\s.!]*$/i,
      /\s*(?:please )?(?:like and |don't forget to )?subscribe(?: to my channel)?[\s.!]*$/i,
      /\s*thank you[\s.!]*$/i,
      /\s*thanks[\s.!]*$/i,
      /\s*goodbye[\s.!]*$/i,
      /\s*bye[\s.!]*$/i,
      /\s*\[(?:music|applause|silence|laughter|inaudible)\][\s.!]*$/i,
    ];
    // Whole-string variants — if the ENTIRE transcription is just one of these
    // (silence triggered the model to confabulate), drop it to empty so the
    // existing "No speech detected" overlay handles it instead of pasting
    // a phantom "Thank you for watching." Built from the tail patterns by
    // anchoring start (^) and dropping the leading whitespace allowance.
    const HALLUCINATION_WHOLE_PATTERNS = [
      /^\s*thank you for watching[\s.!]*$/i,
      /^\s*thanks for watching[\s.!]*$/i,
      /^\s*(?:please )?(?:like and |don't forget to )?subscribe(?: to my channel)?[\s.!]*$/i,
      /^\s*thank you[\s.!]*$/i,
      /^\s*thanks[\s.!]*$/i,
      /^\s*goodbye[\s.!]*$/i,
      /^\s*bye[\s.!]*$/i,
      /^\s*\[(?:music|applause|silence|laughter|inaudible)\][\s.!]*$/i,
      /^\s*you[\s.!]*$/i, // single-word "you." — common Whisper silence output
    ];
    const HALLUCINATION_MIN_BODY_CHARS = 10;

    function cleanHallucinations(text) {
      if (!text) return text;
      const trimmed = text.trim();
      if (!trimmed) return '';

      // Whole-string: entire output is a hallucination (silence triggered it).
      // Return empty so main treats it as "no speech detected".
      for (const pattern of HALLUCINATION_WHOLE_PATTERNS) {
        if (pattern.test(trimmed)) {
          console.log(`hallucination: whole-string match "${trimmed}" — treating as silence`);
          return '';
        }
      }

      // Tail strip: remove trailing hallucinations after substantial body.
      let cleaned = trimmed;
      let changed = true;
      while (changed) {
        changed = false;
        for (const pattern of HALLUCINATION_TAIL_PATTERNS) {
          const match = cleaned.match(pattern);
          if (!match) continue;
          const matchStart = cleaned.length - match[0].length;
          const body = cleaned.slice(0, matchStart).trim();
          if (body.length >= HALLUCINATION_MIN_BODY_CHARS) {
            console.log(`hallucination strip: removed "${match[0].trim()}" (body=${body.length} chars)`);
            cleaned = body;
            changed = true;
            break;
          }
        }
      }
      return cleaned.trim();
    }

    // ============================================
    // Transcription
    // ============================================
    async function transcribeAudio(audioBlob, sessionId) {
      console.log('Starting transcription, blob size:', audioBlob.size, 'session:', sessionId);
      console.log('Provider:', transcriptionProvider);

      const useGroq = transcriptionProvider === 'groq';
      const primaryKey = useGroq ? groqApiKey : apiKey;
      const fallbackKey = useGroq ? apiKey : groqApiKey;
      const hasFallback = !!fallbackKey;

      console.log('API key available:', primaryKey ? 'YES' : 'NO');
      console.log('Fallback available:', hasFallback ? 'YES' : 'NO');

      // Validate API key
      if (!primaryKey) {
        console.error('No API key!');
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(`${useGroq ? 'Groq' : 'OpenAI'} API key not configured`);
        }
        return;
      }

      // Validate audio size (minimum ~1KB for meaningful audio)
      if (audioBlob.size < 1000) {
        console.log('Audio blob too small, skipping');
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionResult('');
        }
        return;
      }

      // Create abort controller for this transcription
      currentAbortController = new AbortController();
      const abortController = currentAbortController;

      // Helper to call API
      async function callTranscriptionAPI(provider, key) {
        const isGroq = provider === 'groq';
        const formData = new FormData();
        const audioFile = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
        formData.append('file', audioFile);
        formData.append('model', isGroq ? 'whisper-large-v3-turbo' : 'whisper-1');
        // Spelling hints: Whisper biases toward terms in the prompt. Capped
        // well under the 224-token prompt limit.
        if (customVocabulary) {
          formData.append('prompt', customVocabulary.slice(0, 700));
        }
        formData.append('response_format', 'text');
        // Force English decoding so the model can't drift into multilingual
        // word-salad hallucinations on silence ("Конечно dépend Church of...").
        formData.append('language', 'en');
        // Deterministic decoding — suppresses low-probability tokens that
        // hallucinations are typically sampled from.
        formData.append('temperature', '0');

        const endpoint = isGroq
          ? 'https://api.groq.com/openai/v1/audio/transcriptions'
          : 'https://api.openai.com/v1/audio/transcriptions';

        const TIMEOUT_MS = 10000; // 10s — short clips should return in 1-3s; anything longer is a hang
        console.log(`fetch START ${isGroq ? 'Groq' : 'OpenAI'} endpoint=${endpoint} blob=${audioBlob.size} timeout=${TIMEOUT_MS}ms key.len=${(key || '').length}`);

        const timeoutId = setTimeout(() => {
          console.warn(`fetch TIMEOUT after ${TIMEOUT_MS}ms — aborting`);
          abortController.abort();
        }, TIMEOUT_MS);

        const fetchStart = Date.now();
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${key}` },
          body: formData,
          signal: abortController.signal
        });

        clearTimeout(timeoutId);
        const elapsedMs = Date.now() - fetchStart;
        console.log(`fetch DONE status=${response.status} elapsed=${elapsedMs}ms`);

        return { response, provider: isGroq ? 'Groq' : 'OpenAI', elapsedMs };
      }

      try {
        // Try primary provider
        const primaryProvider = useGroq ? 'groq' : 'openai';
        let { response, provider, elapsedMs } = await callTranscriptionAPI(primaryProvider, primaryKey);

        // Fallback on rate limit or server error
        if (!response.ok && hasFallback && (response.status === 429 || response.status >= 500)) {
          console.log(`${provider} failed with ${response.status}, falling back...`);
          const fallbackProvider = useGroq ? 'openai' : 'groq';
          const fallbackResult = await callTranscriptionAPI(fallbackProvider, fallbackKey);
          response = fallbackResult.response;
          provider = fallbackResult.provider;
          elapsedMs = fallbackResult.elapsedMs;
        }

        if (!response.ok) {
          const errorText = await response.text();
          let errorMessage = `API error: ${response.status}`;

          try {
            const errorJson = JSON.parse(errorText);
            if (errorJson.error?.message) {
              errorMessage = errorJson.error.message;
            }
          } catch (e) {
            errorMessage = errorText || errorMessage;
          }

          throw new Error(errorMessage);
        }

        const rawText = (await response.text()).trim();
        const cleanedText = cleanHallucinations(rawText);
        if (cleanedText !== rawText) {
          console.log(`hallucination cleaned: ${rawText.length} -> ${cleanedText.length} chars`);
        }
        console.log(`Transcription result (via ${provider}):`, cleanedText);

        // Only send if still current session
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionResult(cleanedText, elapsedMs);
        } else {
          console.log('Ignoring stale result from session', sessionId);
        }

      } catch (error) {
        // Ignore aborted requests from old sessions
        if (error.name === 'AbortError' && sessionId !== recordingSessionId) {
          console.log('Ignoring aborted request from old session', sessionId);
          return;
        }

        console.error('Transcription failed:', error);

        let message = error.message;
        if (error.name === 'AbortError') {
          message = 'Timed out. Try again, or restart Whisp.';
        }

        // Only send error if still current session
        if (sessionId === recordingSessionId) {
          window.electronAPI.sendTranscriptionError(message);
        } else {
          console.log('Ignoring stale error from session', sessionId);
        }
      }
    }

    // ============================================
    // IPC Message Listeners
    // ============================================
    window.electronAPI.onStartRecording(() => {
      startRecording();
    });

    window.electronAPI.onStopRecording(() => {
      stopRecording();
    });

    window.electronAPI.onCancelRecording(() => {
      cancelRecording();
    });

    window.electronAPI.onAbortTranscription(() => {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
    });

    // Tell main when the OS network comes/goes (Wi-Fi <-> hotspot switch, drop,
    // reconnect). Main flushes the shared Chromium socket pool + DNS so the next
    // transcription doesn't reuse a dead connection from the old network.
    window.addEventListener('online', () => window.electronAPI.notifyNetworkChange('online'));
    window.addEventListener('offline', () => window.electronAPI.notifyNetworkChange('offline'));
  </script>
</body>
</html>
