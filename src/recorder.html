<!DOCTYPE html>
<html>
<head>
  <title>Voice Recorder</title>
</head>
<body>
  <script>
    const { ipcRenderer } = require('electron');

    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;
    let apiKey = '';
    let cancelled = false;
    let audioContext = null;
    let analyser = null;
    let levelInterval = null;

    // Receive API key from main process
    ipcRenderer.on('set-api-key', (event, key) => {
      apiKey = key;
      console.log('API key received:', key ? `${key.substring(0, 10)}...` : 'EMPTY');
    });

    async function startRecording() {
      console.log('startRecording called');
      cancelled = false;

      try {
        console.log('Requesting microphone access...');
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
          }
        });

        currentStream = stream;

        // Set up Web Audio API for audio level visualization
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.5;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // Send audio levels to main process for waveform visualization
        levelInterval = setInterval(() => {
          analyser.getByteFrequencyData(dataArray);

          // Get 5 frequency bands for the bars
          const bandSize = Math.floor(bufferLength / 5);
          const levels = [];
          for (let i = 0; i < 5; i++) {
            const start = i * bandSize;
            const end = start + bandSize;
            let sum = 0;
            for (let j = start; j < end; j++) {
              sum += dataArray[j];
            }
            // Normalize to 0-1 range
            levels.push(sum / (bandSize * 255));
          }

          ipcRenderer.send('audio-levels', levels);
        }, 50); // ~20fps for smooth animation

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          console.log('MediaRecorder stopped, chunks:', audioChunks.length);
          // Stop all tracks
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
          }

          // Don't transcribe if cancelled
          if (cancelled) {
            console.log('Recording was cancelled, not transcribing');
            return;
          }

          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          console.log('Created audio blob, size:', audioBlob.size);
          await transcribeAudio(audioBlob);
        };

        mediaRecorder.start(100); // Collect data every 100ms
        console.log('MediaRecorder started');
        ipcRenderer.send('recording-status', 'started');

      } catch (error) {
        console.error('Failed to start recording:', error);
        ipcRenderer.send('transcription-error', `Microphone access denied: ${error.message}`);
      }
    }

    function stopRecording() {
      // Stop audio level monitoring
      if (levelInterval) {
        clearInterval(levelInterval);
        levelInterval = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        ipcRenderer.send('recording-status', 'stopped');
      }
    }

    // Convert audio blob to WAV format for better API compatibility
    async function convertToWav(audioBlob) {
      const arrayBuffer = await audioBlob.arrayBuffer();
      const audioCtx = new AudioContext();

      try {
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        // Get audio data
        const numberOfChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const length = audioBuffer.length;

        // Create WAV file
        const wavBuffer = new ArrayBuffer(44 + length * numberOfChannels * 2);
        const view = new DataView(wavBuffer);

        // WAV header
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + length * numberOfChannels * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true); // PCM format chunk size
        view.setUint16(20, 1, true); // Audio format (PCM)
        view.setUint16(22, numberOfChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numberOfChannels * 2, true); // Byte rate
        view.setUint16(32, numberOfChannels * 2, true); // Block align
        view.setUint16(34, 16, true); // Bits per sample
        writeString(36, 'data');
        view.setUint32(40, length * numberOfChannels * 2, true);

        // Write audio data
        const offset = 44;
        for (let i = 0; i < length; i++) {
          for (let channel = 0; channel < numberOfChannels; channel++) {
            const sample = audioBuffer.getChannelData(channel)[i];
            // Convert float [-1, 1] to 16-bit PCM
            const intSample = Math.max(-1, Math.min(1, sample)) * 0x7FFF;
            view.setInt16(offset + (i * numberOfChannels + channel) * 2, intSample, true);
          }
        }

        audioCtx.close();
        return new Blob([wavBuffer], { type: 'audio/wav' });
      } catch (error) {
        console.error('WAV conversion failed:', error);
        audioCtx.close();
        throw error;
      }
    }

    function cancelRecording() {
      cancelled = true;

      // Stop audio level monitoring
      if (levelInterval) {
        clearInterval(levelInterval);
        levelInterval = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      audioChunks = [];
      ipcRenderer.send('recording-status', 'cancelled');
    }

    async function transcribeAudio(audioBlob) {
      console.log('Starting transcription, blob size:', audioBlob.size);
      console.log('API key available:', apiKey ? 'YES' : 'NO');

      if (!apiKey) {
        console.error('No API key!');
        ipcRenderer.send('transcription-error', 'API key not configured');
        return;
      }

      // Check if there's actually audio data
      if (audioBlob.size < 1000) {
        console.log('Audio blob too small, skipping');
        ipcRenderer.send('transcription-result', '');
        return;
      }

      try {
        // Send webm directly - it's a supported format
        const formData = new FormData();
        const audioFile = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
        formData.append('file', audioFile);
        formData.append('model', 'whisper-1');
        formData.append('response_format', 'text');

        console.log('Sending to Whisper API, file size:', audioBlob.size);

        // Use AbortController for timeout (60s for long recordings)
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 second timeout

        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`
            // Don't set Content-Type - browser will set it with correct boundary
          },
          body: formData,
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        console.log('API response status:', response.status);

        if (!response.ok) {
          const errorText = await response.text();
          let errorMessage = `API error: ${response.status}`;

          try {
            const errorJson = JSON.parse(errorText);
            if (errorJson.error?.message) {
              errorMessage = errorJson.error.message;
            }
          } catch (e) {
            errorMessage = errorText || errorMessage;
          }

          throw new Error(errorMessage);
        }

        const text = await response.text();
        console.log('Transcription result:', text.trim());
        ipcRenderer.send('transcription-result', text.trim());

      } catch (error) {
        console.error('Transcription failed:', error);

        let message = error.message;
        if (error.name === 'AbortError') {
          message = 'Request timed out. Please try again.';
        }

        ipcRenderer.send('transcription-error', message);
      }
    }

    // Listen for IPC messages
    ipcRenderer.on('start-recording', () => {
      startRecording();
    });

    ipcRenderer.on('stop-recording', () => {
      stopRecording();
    });

    ipcRenderer.on('cancel-recording', () => {
      cancelRecording();
    });

    console.log('Recorder ready');
  </script>
</body>
</html>
