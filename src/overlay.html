<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Whisp</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: var(--font);
      height: 100%;
    }
    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: var(--space-24);
    }

    /* Stage handles arrival and the success drop. */
    .stage {
      opacity: 0;
      transform: translateY(14px) scale(0.96);
    }
    .stage.shown {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: transform 280ms cubic-bezier(0.3, 1.4, 0.6, 1), opacity 140ms ease-out;
    }
    .stage.drop {
      opacity: 0;
      transform: translateY(30px) scale(0.92);
      transition: transform 260ms cubic-bezier(0.55, 0, 0.85, 0.4), opacity 220ms ease-in 20ms;
    }

    /* The capsule: dot, wave, timer. Contracts to a circle on success. */
    /* No backdrop-filter here: a transparent Electron window has no backdrop
       to sample, and Chromium paints a ghost pill around the element instead. */
    .capsule {
      width: 158px;
      height: 42px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      color: var(--glass-ink);
      cursor: grab;
      user-select: none;
      -webkit-app-region: drag;
      transition: width 380ms cubic-bezier(0.55, -0.18, 0.28, 1.2);
    }
    .stage.ok .capsule { width: 42px; animation: settle 400ms cubic-bezier(0.4, 0, 0.4, 1); }
    @keyframes settle {
      0% { transform: translateY(0); }
      45% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }

    .body { display: flex; align-items: center; gap: var(--space-8); white-space: nowrap; transition: opacity 150ms ease; }
    .stage.ok .body { opacity: 0; }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background-color 250ms ease; }
    .stage.tx .dot { background: var(--orange); }

    .wave { display: flex; align-items: center; gap: 2.5px; height: 24px; }
    .wave i {
      width: 2.5px; height: 4px; border-radius: 1.5px;
      background: currentColor; opacity: 0.85;
      transition: height 90ms ease-out;
    }
    .stage.tx .wave i { height: 5px !important; animation: breathe 1.1s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }

    .timer {
      font-size: 12px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      opacity: 0.55;
      transition: opacity 200ms ease;
    }
    .stage.tx .timer { opacity: 0.3; }

    .check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
    .stage.ok .check { opacity: 1; transition: opacity 140ms ease 220ms; }
    .check svg { width: 18px; height: 18px; }
    .check path {
      stroke: var(--green); stroke-width: 2.4; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 20; stroke-dashoffset: 20;
    }
    .stage.ok .check path { stroke-dashoffset: 0; transition: stroke-dashoffset 260ms ease-out 340ms; }

    /* Message pill: errors and the paste-failed case. */
    .msg {
      display: none;
      align-items: center;
      gap: var(--space-8);
      height: 38px;
      padding: 0 var(--space-16);
      border-radius: 19px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      color: var(--glass-ink);
      font-size: 12.5px;
      white-space: nowrap;
      cursor: grab;
      user-select: none;
      -webkit-app-region: drag;
    }
    .stage.msg-mode .capsule { display: none; }
    .stage.msg-mode .msg { display: flex; }
    .msg .mdot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .msg.neutral .mdot { background: var(--secondary); }
    .msg kbd {
      font-size: 10px; font-family: inherit; border-radius: 3px; padding: var(--space-2) var(--space-6);
      background: rgba(127, 127, 127, 0.18);
      -webkit-app-region: no-drag;
    }

    /* Hover-only close. */
    .x {
      position: absolute;
      top: -6px; right: -6px;
      width: 20px; height: 20px;
      border: none; border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--glass-ink);
      font-size: 12px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 150ms ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }
    .stage:hover .x { opacity: 1; }
    .stage.ok .x { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .stage, .capsule, .body, .check, .check path { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <button type="button" class="x" id="closeBtn" aria-label="Close">×</button>
    <div class="capsule" id="capsule">
      <div class="body" id="capBody">
        <span class="dot"></span>
        <span class="wave" id="wave"></span>
        <span class="timer" id="timer">00:00</span>
      </div>
      <span class="check"><svg viewBox="0 0 18 18"><path d="M4.5 9.5l3.5 3.5 6-7"/></svg></span>
    </div>
    <div class="msg" id="msg"><span class="mdot" id="mdot"></span><span id="msgText"></span><kbd id="msgKbd">esc</kbd></div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const waveEl = document.getElementById('wave');
    const timerEl = document.getElementById('timer');
    const msgEl = document.getElementById('msg');
    const msgText = document.getElementById('msgText');
    const msgKbd = document.getElementById('msgKbd');

    const BAR_COUNT = 13;
    const bars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const b = document.createElement('i');
      waveEl.appendChild(b);
      bars.push(b);
    }
    // Display order: lowest (loudest) band in the middle, highs at the edges.
    const CENTER = Math.floor(BAR_COUNT / 2);
    function bandForPosition(i) {
      return Math.abs(i - CENTER) * 2 - (i < CENTER ? 1 : 0);
    }
    const LEVEL_GAIN = 2.0;

    let startTime = Date.now();
    let timerInterval = null;
    let dropTimer = null;

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }
    function startTimer() {
      startTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
    }
    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function setStage(cls) {
      if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
      stage.className = 'stage shown ' + cls;
    }

    function showState(state, data = {}) {
      switch (state) {
        case 'recording':
          setStage('');
          startTimer();
          break;
        case 'transcribing':
          setStage('tx');
          stopTimer();
          break;
        case 'success':
          // Contract to a circle, draw the check, then drop away.
          // Main hides the window at 1500ms; the drop starts at 1100ms.
          setStage('ok');
          stopTimer();
          dropTimer = setTimeout(() => { stage.classList.add('drop'); }, 1100);
          break;
        case 'copy':
          // Auto-paste failed or is off: the text is on the clipboard.
          setStage('msg-mode');
          msgEl.classList.add('neutral');
          msgText.textContent = 'Copied. Press ⌘V to paste.';
          msgKbd.style.display = 'none';
          stopTimer();
          break;
        case 'error':
          setStage('msg-mode');
          msgEl.classList.remove('neutral');
          msgText.textContent = data.error || 'Something went wrong';
          msgKbd.style.display = '';
          stopTimer();
          break;
      }
    }

    window.electronAPI.onUpdateOverlay((data) => {
      showState(data.state, data);
    });

    window.electronAPI.onAudioLevels((levels) => {
      if (!Array.isArray(levels)) return;
      for (let i = 0; i < BAR_COUNT; i++) {
        const level = levels[bandForPosition(i)] || 0;
        // sqrt lifts quiet speech into the visible range without clipping loud
        const v = Math.min(1, Math.sqrt(level * LEVEL_GAIN));
        const h = 4 + v * 20;
        bars[i].style.height = h.toFixed(1) + 'px';
      }
    });

    document.getElementById('closeBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      window.electronAPI.closeOverlay();
    });

    showState('recording');
  </script>
</body>
</html>
